<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">

    <!-- Cordova脚本 -->
    <script type="text/javascript" src="cordova.js"></script>

    <title>FitPet - 青少年健身应用</title>

    <!-- 样式 -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        /* 移动端优化 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
<!-- 应用容器 -->
<div id="app-container" class="app-container">
    <!-- 你的现有登录页面内容 -->
    <div class="container">
        <div class="logo-section">
            <div class="pet-logo">
                <i class="fas fa-paw"></i>
            </div>
            <h1>FitPet</h1>
            <p class="tagline">运动养宠 · 健康公益 · 轻松开始</p>
        </div>

        <div class="login-box">
            <h2>欢迎来到 FitPet</h2>
            <p class="subtitle">专为青少年设计的趣味健身应用</p>

            <div class="login-options">
                <button class="login-btn wechat" onclick="loginWithWechat()">
                    <i class="fab fa-weixin"></i>
                    微信一键登录
                </button>

                <button class="login-btn qq" onclick="loginWithQQ()">
                    <i class="fab fa-qq"></i>
                    QQ一键登录
                </button>

                <button class="login-btn demo" onclick="loginAsDemo()">
                    <i class="fas fa-user"></i>
                    体验版登录
                </button>
            </div>

            <div class="features">
                <div class="feature">
                    <i class="fas fa-heart"></i>
                    <span>3分钟个性化计划</span>
                </div>
                <div class="feature">
                    <i class="fas fa-gamepad"></i>
                    <span>虚拟宠物养成</span>
                </div>
                <div class="feature">
                    <i class="fas fa-hands-helping"></i>
                    <span>运动兑换公益捐赠</span>
                </div>
            </div>

            <p class="agreement">
                登录即表示同意
                <a href="#">用户协议</a>
                和
                <a href="#">隐私政策</a>
            </p>
        </div>

        <div class="stats">
            <div class="stat">
                <span class="number">2,847</span>
                <span class="label">今日活跃用户</span>
            </div>
            <div class="stat">
                <span class="number">15,392</span>
                <span class="label">累计捐赠(元)</span>
            </div>
        </div>
    </div>
</div>

<!-- 脚本 -->
<script src="cordova.js"></script>
<script src="script.js"></script>
<script src="app-core.js"></script>
<script src="mobile.js"></script>
<script src="index.js"></script>

<script>
    // 等待设备准备就绪
    document.addEventListener('deviceready', function() {
        console.log('设备准备就绪');

        // 隐藏启动画面
        if (navigator.splashscreen) {
            navigator.splashscreen.hide();
        }

        // 设置状态栏
        if (window.StatusBar) {
            StatusBar.styleDefault();
            StatusBar.backgroundColorByHexString("#667eea");
        }
    }, false);
</script>
</body>
</html>
